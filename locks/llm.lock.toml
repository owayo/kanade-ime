# Identities registered in crates/kanade-llm/src/profile.rs. A test keeps this
# file, the source constants and Cargo.lock in step: every registered model and
# profile has one table here, and no table exists without a registration.
# Nothing here is downloaded by a build or at run time: a model is obtained and
# imported by the user.

