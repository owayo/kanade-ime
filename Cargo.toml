[workspace]
members = ["crates/*", "tools/xtask"]
default-members = ["crates/kanade-engine", "crates/kanade-eval", "crates/kanade-imk", "crates/kanade-tip"]
resolver = "3"
exclude = ["third_party/mozc", "third_party/hasami", "artifacts/analyzer-source"]

[patch."https://github.com/owayo/hasami"]
hasami = { path = "third_party/hasami" }

[workspace.package]
version = "26.11.112"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/owayo/kanade-ime"

[workspace.metadata.project-standard]
readme-languages = ["ja"]

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
sha2 = "0.11.1"
libc = "0.2.191"
tempfile = "3.27.0"
notify = "8.2.2"
hasami = { git = "https://github.com/owayo/hasami", rev = "47c7dec1870d812b60cbddc67be18bcc077947a2", default-features = false, features = ["analyzer"] }
noslop = { git = "https://github.com/owayo/noslop", tag = "v26.11.101", default-features = false }
kanade-ipc = { path = "crates/kanade-ipc" }
kanade-mozc = { path = "crates/kanade-mozc" }
kanade-learn = { path = "crates/kanade-learn" }
kanade-engine = { path = "crates/kanade-engine" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
